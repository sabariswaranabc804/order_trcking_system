version: "3.9"

services:
  backend:
    container_name: ots-backend

    image: ots-backend:latest

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8099:8099"

    volumes:
      - ots_data:/app/uploads

volumes:
  ots_data:
    external: true
    name: ots-backendonly_ots_data